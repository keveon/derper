name: Build and Push Derper Image

on:
  # 推送到 main 时构建（首次初始化 + Dockerfile 变更）
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
      - .github/workflows/version.json

  # 每天检查 Tailscale 新版本
  schedule:
    - cron: '0 2 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: 'Tailscale version tag (e.g. v1.102.2), leave empty for latest'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      built: ${{ steps.check.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      # ──── 确定要构建的版本号 ────
      - name: Resolve Tailscale version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl -fsSL https://api.github.com/repos/tailscale/tailscale/releases/latest \
              | jq -r '.tag_name')
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ──── 检查这个版本的镜像是否已经构建过 ────
      # 推送标签是 ghcr.io/<owner>/<repo>:$VERSION（与下方 metadata-action 的 images 一致）。
      # 多架构构建产物是 OCI index；Accept 不含 index 类型时 GHCR 对已存在的标签也返回 404。
      # GITHUB_TOKEN 是 registry 的登录密码，manifest 请求要先换成 pull scope 的 bearer。
      - name: Check if image already exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Checking ${{ env.REGISTRY }}/${IMAGE}:${VERSION}"
          REGISTRY_TOKEN=$(curl -fsSL \
            --user "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://${{ env.REGISTRY }}/token?service=${{ env.REGISTRY }}&scope=repository:${IMAGE}:pull" \
            | jq -r '.token // empty')
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "Could not obtain a GHCR pull token for ${IMAGE}"
            exit 1
          fi
          RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://${{ env.REGISTRY }}/v2/${IMAGE}/manifests/${VERSION}")
          echo "Manifest HTTP ${RESPONSE}"

          if [ "$RESPONSE" = "200" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Image ${{ env.REGISTRY }}/${IMAGE}:${VERSION} already exists, skipping scheduled build"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build
        if: steps.check.outputs.built == 'false'
        run: echo "No new version to build. Stopping."

      # ──── 构建并推送 ────
      - name: Set up QEMU
        if: steps.check.outputs.built == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.built == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.built == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.built == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.built == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DERP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
